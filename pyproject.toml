[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-contract-review-demo"
version = "0.1.0"
description = "Synthetic legal contract review demo with persistent Mubit memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mubit-sdk==0.13.2",
    "openai==3.8.0",
    "pydantic==2.13.4",
]

[project.scripts]
contract-review = "contract_review:main"

[tool.setuptools]
py-modules = ["contract_review"]
